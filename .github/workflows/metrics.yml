name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 00:00 (São Paulo)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: America/Sao_Paulo
          # include repos from organizations you belong to, not just your own
          repositories_affiliations: owner, collaborator, organization_member
          # old study projects with vendored libraries that distort the totals
          repositories_skipped: scanbook2, Aula-com-Jquery, HomeCareRP, MensageriaEmail, AmigosSolidarios
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, dockerfile, shell
